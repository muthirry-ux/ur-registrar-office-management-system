<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>UR Registrar Management System</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{--bg:#f3f5f9;--sf:#fff;--sf2:#eaeef5;--tx:#0f1b2d;--mu:#5b6b82;--bd:#d5dbe6;--ac:#1f7ae0;--ac2:#3b3fc4;--gd:#e8a900;--ok:#1a9a5a;--er:#d8404a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1224;--sf:#101a30;--sf2:#16223d;--tx:#e8eef9;--mu:#8fa0bd;--bd:#22304f;--ac:#4aa3ff;--ac2:#5b5fe0;--gd:#f5b301;--ok:#3ccf8e;--er:#ff6b73;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1224;--sf:#101a30;--sf2:#16223d;--tx:#e8eef9;--mu:#8fa0bd;--bd:#22304f;--ac:#4aa3ff;--ac2:#5b5fe0;--gd:#f5b301;--ok:#3ccf8e;--er:#ff6b73;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--sf);border-bottom:3px solid var(--gd);flex-wrap:wrap}
header img{width:40px;height:40px;border-radius:50%}header b{font-size:17px}header small{color:var(--mu)}.sp{flex:1}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:7px 11px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.no{background:var(--er);color:#fff;border-color:var(--er)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gd)}
#app{display:flex;min-height:calc(100vh - 66px)}nav{width:215px;background:var(--sf);border-right:1px solid var(--bd);padding:12px 8px;flex-shrink:0}
nav h6{margin:12px 8px 4px;color:var(--mu);font-size:12px;font-weight:600}nav a{display:block;padding:8px 10px;border-radius:6px;cursor:pointer;border-left:3px solid transparent}nav a.on{background:var(--sf2);border-left-color:var(--gd);color:var(--ac);font-weight:600}
main{flex:1;padding:18px;min-width:0}h2{margin:0 0 2px;font-size:22px}.sub{color:var(--mu);margin:0 0 14px}
.g{display:grid;gap:12px;margin-bottom:12px}.k5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;min-width:0}.card h4{margin:0 0 10px;font-size:14px}
.kpi small{color:var(--mu)}.kpi b{display:block;font-size:27px;margin:2px 0}.bar{height:6px;background:var(--sf2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gd)}
.hb{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;margin:5px 0}.hb .bar{height:10px}.hb .bar i{background:var(--ac)}
.tr{display:flex;align-items:flex-end;gap:6px;height:190px;overflow-x:auto;padding-top:16px}.tr div{flex:1;min-width:34px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:11px;color:var(--mu)}.tr s{display:block;text-decoration:none}.tr .m{background:var(--ac)}.tr .f{background:var(--ac2)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}th{background:var(--sf2);font-size:12px;color:var(--mu)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--sf2)}.tag.Approved,.tag.Issued{color:var(--ok)}.tag.Rejected{color:var(--er)}.tag.Submitted,.tag.Review{color:var(--gd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.row>*{flex:0 1 auto}.f2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.f2 label{display:block;color:var(--mu);font-size:12px}.f2 input,.f2 select,.f2 textarea{width:100%}
#login{max-width:460px;margin:6vh auto;padding:0 16px}.msg{padding:9px 12px;border-radius:6px;background:var(--sf2);margin:8px 0}.err{color:var(--er)}.mu{color:var(--mu)}
@media(max-width:760px){#app{flex-direction:column}nav{width:100%;display:flex;flex-wrap:wrap;gap:4px;border-right:0}nav h6{display:none}}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;border:1px solid currentColor}.chip.ok{color:var(--ok)}.chip.watch{color:var(--gd)}.chip.gap{color:var(--er)}.chip.na{color:var(--mu)}.kpi .sk{display:block;margin-top:6px}.dn{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}.dn span{width:62px;height:62px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-weight:700}.dnr{display:flex;gap:14px;align-items:center;margin:8px 0}.ins li{margin:6px 0}.cb{display:grid;grid-template-columns:48px 1fr 52px 52px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.cb .bar{height:12px}.cb .bar i{background:var(--ac)}.dh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.dh .sp{flex:1}
</style></head><body>

d.setFillColor(10,92,130);d.rect(0,250,W,150,'F');d.setFillColor(232,169,0);d.rect(0,400,W,6,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(25);d.text(d.splitTextToSize(pf(R.title),W-2*M),M,300);d.setFont('helvetica','normal');d.setFontSize(13);d.text(pf(R.sub),M,375);
d.setTextColor(30,40,60);d.setFontSize(11);[['Reference',R.ref],['Prepared by',R.by],['Date',R.at],['Classification',R.cls]].forEach((m,i)=>{d.setFont('helvetica','bold');d.text(m[0]+':',M,470+i*22);d.setFont('helvetica','normal');d.text(pf(m[1]),M+100,470+i*22)});
d.addPage();y=76;const need=h=>{if(y+h>H-60){d.addPage();y=76}};
R.secs.forEach(s=>{need(70);d.setFont('helvetica','bold');d.setFontSize(16);d.setTextColor(10,92,130);d.text(pf(s.h),M,y);y+=8;d.setDrawColor(232,169,0);d.setLineWidth(2);d.line(M,y,M+60,y);y+=22;d.setFont('helvetica','normal');d.setFontSize(10.5);d.setTextColor(30,40,60);s.p.forEach(t=>{const L=d.splitTextToSize(pf(t),W-2*M);need(L.length*14+8);d.text(L,M,y);y+=L.length*14+8});
if(s.ch){const w=W-2*M,h=w*.511;need(h+12);d.addImage(chartPNG(s.ch),'PNG',M,y,w,h);y+=h+14}
if(s.tb){const cw=(W-2*M)/s.tb.cols.length,mc=Math.floor(cw/4.6);need(40);d.setFontSize(9);d.setFillColor(10,92,130);d.rect(M,y-11,W-2*M,17,'F');d.setTextColor(255);d.setFont('helvetica','bold');s.tb.cols.forEach((c,i)=>d.text(pf(c).slice(0,mc),M+i*cw+4,y+1));y+=17;d.setFont('helvetica','normal');d.setTextColor(30,40,60);s.tb.rows.forEach((r,ri)=>{need(18);if(ri%2){d.setFillColor(238,242,248);d.rect(M,y-11,W-2*M,17,'F')}r.forEach((v,i)=>d.text(pf(v).slice(0,mc),M+i*cw+4,y+1));y+=17});y+=12}y+=6});
const N=d.getNumberOfPages();for(let i=2;i<=N;i++){d.setPage(i);d.addImage(LOGO,'PNG',M,16,30,30);d.setFontSize(9);d.setTextColor(91,107,130);d.text('University of Rwanda | Registrar Office Management System',M+38,36);d.setDrawColor(232,169,0);d.setLineWidth(1);d.line(M,52,W-M,52)}
for(let i=1;i<=N;i++){d.setPage(i);d.setFontSize(8.5);d.setTextColor(91,107,130);d.text(pf(R.ref+' | '+R.cls),M,H-28);d.text('Page '+i+' of '+N,W-M,H-28,{align:'right'})}return d.output('blob')}
async function mkDOCX(R){const D=window.docx;if(!D)throw new Error('Word library did not load');const P=(t,o={})=>new D.Paragraph({alignment:o.al,spacing:{after:o.after==null?140:o.after},children:[new D.TextRun({text:String(t),bold:o.b,size:o.sz||22,color:o.c||'1E283C'})]}),ch=[];
ch.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{before:800,after:240},children:[new D.ImageRun({data:u8(LOGO),transformation:{width:120,height:120}})]}),P('University of Rwanda',{al:D.AlignmentType.CENTER,b:1,sz:52,c:'0A5C82'}),P('Registrar Office Management System',{al:D.AlignmentType.CENTER,sz:26,c:'5B6B82',after:600}),P(R.title,{al:D.AlignmentType.CENTER,b:1,sz:44,c:'0A5C82'}),P(R.sub,{al:D.AlignmentType.CENTER,sz:26,after:700}),P('Reference: '+R.ref),P('Prepared by: '+R.by),P('Date: '+R.at),P('Classification: '+R.cls),new D.Paragraph({children:[new D.PageBreak()]}));
R.secs.forEach(s=>{ch.push(new D.Paragraph({text:s.h,heading:D.HeadingLevel.HEADING_1,spacing:{before:200,after:140}}));s.p.forEach(t=>ch.push(P(t)));if(s.ch)ch.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.ImageRun({data:u8(chartPNG(s.ch)),transformation:{width:600,height:307}})]}));
if(s.tb){const cell=(t,h)=>new D.TableCell({shading:h?{fill:'0A5C82',type:D.ShadingType.CLEAR,color:'auto'}:undefined,children:[P(t,{sz:18,b:h,c:h?'FFFFFF':'1E283C',after:40})]});ch.push(new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:[new D.TableRow({children:s.tb.cols.map(c=>cell(c,1))})].concat(s.tb.rows.map(r=>new D.TableRow({children:r.map(v=>cell(v,0))})))}),P('',{after:120}))}});
const doc=new D.Document({creator:'UR Registrar System',title:R.title,sections:[{headers:{default:new D.Header({children:[P('University of Rwanda | Registrar Office Management System',{sz:16,c:'5B6B82'})]})},footers:{default:new D.Footer({children:[new D.Paragraph({alignment:D.AlignmentType.RIGHT,children:[new D.TextRun({children:[R.ref+' | Page ',D.PageNumber.CURRENT,' of ',D.PageNumber.TOTAL_PAGES],size:16,color:'5B6B82'})]})]})},children:ch}]});return D.Packer.toBlob(doc)}
async function mkPPTX(R){if(!window.PptxGenJS)throw new Error('PowerPoint library did not load');const p=new PptxGenJS(),LG=LOGO.replace(/^data:/,'');p.layout='LAYOUT_WIDE';p.defineSlideMaster({title:'UR',background:{color:'FFFFFF'},objects:[{rect:{x:0,y:0,w:13.33,h:.9,fill:{color:'0A5C82'}}},{rect:{x:0,y:.9,w:13.33,h:.06,fill:{color:'E8A900'}}},{image:{x:.3,y:.1,w:.7,h:.7,data:LG}},{text:{text:'University of Rwanda | Registrar Office',options:{x:1.15,y:.22,w:9,h:.45,fontSize:15,bold:true,color:'FFFFFF'}}},{text:{text:R.ref,options:{x:.4,y:7.05,w:6,h:.3,fontSize:9,color:'5B6B82'}}}],slideNumber:{x:12.4,y:7.05,fontSize:10,color:'5B6B82'}});
const s0=p.addSlide();s0.background={color:'0A5C82'};s0.addImage({data:LG,x:.7,y:.7,w:1.6,h:1.6});s0.addText('University of Rwanda',{x:2.6,y:.9,w:9,h:.6,fontSize:30,bold:true,color:'FFFFFF'});s0.addText('Registrar Office Management System',{x:2.6,y:1.5,w:9,h:.4,fontSize:16,color:'E8A900'});s0.addText(R.title,{x:.7,y:3,w:12,h:1.3,fontSize:38,bold:true,color:'FFFFFF'});s0.addText(R.sub,{x:.7,y:4.4,w:12,h:.5,fontSize:20,color:'DCE6F2'});s0.addText(R.by+' | '+R.at+' | '+R.cls,{x:.7,y:6.6,w:12,h:.4,fontSize:12,color:'DCE6F2'});
R.secs.forEach(s=>{const sl=p.addSlide({masterName:'UR'});sl.addText(s.h,{x:.5,y:1.1,w:12,h:.6,fontSize:26,bold:true,color:'0A5C82'});const bl=s.p.slice(0,3).map(t=>({text:t,options:{bullet:true,breakLine:true,fontSize:s.ch?14:16,color:'1E283C',paraSpaceAfter:8}}));
if(s.ch){sl.addText(bl,{x:.5,y:1.9,w:5.2,h:4.8,valign:'top'});sl.addImage({data:chartPNG(s.ch).replace(/^data:/,''),x:5.9,y:1.9,w:7,h:3.58})}else{sl.addText(bl,{x:.5,y:1.9,w:12.3,h:s.tb?1.9:4.8,valign:'top'});if(s.tb)sl.addTable([s.tb.cols.map(c=>({text:c,options:{bold:true,color:'FFFFFF',fill:{color:'0A5C82'}}}))].concat(s.tb.rows.slice(0,8).map(r=>r.map(v=>({text:String(v)})))),{x:.5,y:3.9,w:12.3,fontSize:11,border:{type:'solid',color:'D5DBE6',pt:.5}})}});return p.write({outputType:'blob'})}
async function genRep(f){RP=buildReport(RT);const st=E('rs');if(st)st.textContent='Generating '+f.toUpperCase()+' with charts. This can take a few seconds.';try{const b=await(f=='pdf'?mkPDF:f=='docx'?mkDOCX:mkPPTX)(RP);await saveFile(RP.ref+'.'+f,b,'report '+RT+' '+f,1);if(E('rs'))E('rs').textContent='Finished. Check your downloads.'}catch(e){if(E('rs'))E('rs').textContent='Could not generate the file: '+((e&&e.message)||'unknown error')}}
